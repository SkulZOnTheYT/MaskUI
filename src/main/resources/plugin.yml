name: MaskUI
version: '1.0.0'
main: com.github.skulzontheyt.maskui.MaskUIPlugin
api-version: '1.16'
authors: SkulZOnTheYT
description: Buy wearable mob masks that grant potion effects.
depend: [Vault]

commands:
  mask:
    description: Open the MaskUI shop or wiki
    usage: /mask <open|wiki|buy|sell|status|help|give|reload>
    permission: maskui.command

permissions:
  maskui.command:
    description: Allows use of the MaskUI command
    default: true

  maskui.admin:
    description: Allows giving masks and reloading configuration
    default: op
